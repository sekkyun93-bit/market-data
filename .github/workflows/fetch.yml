name: Fetch market data

on:
  schedule:
    # 06:05 and 06:25 KST, Monday–Saturday (21:05 / 21:25 UTC, Sunday–Friday)
    - cron: "5 21 * * 0-5"
    - cron: "25 21 * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: mkdir -p data && python fetch.py
      - name: Commit data
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
